<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CraniaVerse - Calendar</title>
<style>
  :root{
    --light-blue:#A6E2F9; --dark-blue:#5FA09E; --light-brown:#E0DE85; --dark-brown:#2E2516;
    --bg:#F4F7F8; --shadow:0 1px 3px rgba(46,37,22,.15);
  }
  *{box-sizing:border-box}
  input[type=checkbox]{accent-color:var(--dark-blue)}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--dark-brown);min-height:100vh}
  header{display:flex;align-items:center;gap:14px;padding:14px 20px;background:var(--dark-brown);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);position:sticky;top:0;z-index:20;flex-wrap:wrap}
  .brandwrap{background:#fff;border-radius:8px;padding:5px 10px;display:inline-flex;align-items:center}
  .brand{height:26px;display:block}
  .pv-title{font-weight:700;font-size:18px;color:#fff;white-space:nowrap}
  .spacer{flex:1}
  button{font-family:inherit;cursor:pointer;border-radius:8px;border:1px solid transparent}
  .ghost{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;padding:6px 12px;font-size:13px;font-weight:600}
  .ghost.small{padding:4px 10px;font-size:12px}
  .ghost.on{background:var(--light-blue);color:var(--dark-brown);border-color:var(--light-blue)}
  .layout{display:flex;gap:16px;padding:16px;align-items:flex-start}
  .sidebar{width:220px;flex:none;background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:14px;border-top:3px solid var(--dark-blue)}
  .sidebar h3{margin:0 0 10px;font-size:14px;color:var(--dark-blue)}
  .calrow{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}
  .calrow input[type=checkbox]{accent-color:var(--dark-blue)}
  .swatch{width:14px;height:14px;border-radius:4px;flex:none}
  .calname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
  .calx{background:none;border:none;color:#c9c3b5;font-size:15px;font-weight:700;padding:0 4px}
  .addcal{background:var(--light-blue);color:var(--dark-brown);border:none;padding:5px 12px;font-size:12px;font-weight:700;border-radius:8px}
  .actionsrow{display:flex;gap:6px;align-items:center;padding:8px 20px 0}
  .actionsrow button{background:#fff;border:1px solid #e2ded2;color:var(--dark-brown);padding:4px 10px;font-size:12px;font-weight:700;border-radius:8px;cursor:pointer;font-family:inherit}
  .actionsrow button:hover{background:#f4f2ea}
  .actionsrow button:disabled{opacity:.4;cursor:default}
  .actionsrow #settingsBtn{margin-left:auto}
  /* ---- settings popover ---- */
  .popover{display:none;position:fixed;top:118px;right:16px;z-index:290;background:#fff;border:1px solid #e2ded2;border-radius:12px;box-shadow:0 8px 30px rgba(46,37,22,.18);padding:14px;width:300px;text-align:left;box-sizing:border-box}
  .popover.show{display:block}
  .popover .field.sect{margin:0 0 8px;padding:12px;border-radius:8px}
  .popover .field.sect:nth-child(even){background:#E7EAEC}
  .popover .field.sect:last-child{margin-bottom:0}
  .popover label{display:block;font-weight:700;font-size:13px;margin-bottom:6px;color:var(--dark-brown)}
  .popover .hint{font-size:11px;color:#9a948a;margin:6px 0 8px;line-height:1.4}
  .popover .bkline{font-size:12.5px;color:#6B6455;margin-bottom:2px}
  .popover .bkbtns{display:flex;gap:8px}
  .popover button.small{background:var(--dark-blue);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:2px}
  .popover button.small:hover{filter:brightness(1.08)}
  .calbar2{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:8px 20px 0;flex-wrap:wrap}
  .toggleall{background:#f0efe7;color:var(--dark-brown);border:none;padding:5px 12px;font-size:12px;font-weight:700;border-radius:8px;cursor:pointer;font-family:inherit}
  .toggleall:hover{background:#e6e3d8}
  .godate{padding:5px 8px;border:1px solid #e2ded2;border-radius:7px;font-family:inherit;font-size:13px}
  .golbl{font-size:12px;color:#8a8474;font-weight:600}
  .calbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 16px;background:#fff;border-bottom:1px solid #eee;box-shadow:var(--shadow)}
  .calbar-label{font-size:12px;font-weight:700;color:var(--dark-blue);text-transform:uppercase;letter-spacing:.4px}
  .calchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .calchip{background:#ece9e0;border:none;color:#6b6455;border-radius:6px;padding:4px 9px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .calchip.on{background:var(--light-blue);color:var(--dark-brown);border-color:var(--light-blue)}
  .calchip.dragging{opacity:.45}
  .sidecol{width:290px;flex:none;display:flex;flex-direction:column;gap:16px;min-height:0}
  .sidebox{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:14px;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
  .sidebox.box-up{border-top:3px solid var(--light-brown);flex:1}
  .sidebox.box-td{border-top:3px solid var(--dark-blue);flex:1}
  .sidebox h3{margin:0 0 10px;font-size:14px;color:var(--dark-blue);flex:none}
  #agendaSide,#todoSide{flex:1;min-height:0;overflow:auto}
  .ag-side-time{font-size:10px;color:#8a8474;flex:none;white-space:nowrap}
  .td-head{margin-top:20px!important}
  .td-row{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:1px solid #f2efe6;font-size:13px}
  .td-check{accent-color:var(--dark-blue);flex:none;margin:0}
  .td-text{cursor:pointer;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .td-edit{flex:1;min-width:0;font-family:inherit;font-size:13px;border:1px solid var(--light-blue);border-radius:4px;padding:2px 5px}
  .td-dot{width:8px;height:8px;border-radius:50%;background:#e06666;flex:none}
  .td-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .td-due{font-size:11px;color:#8a8474;flex:none}
  .td-due.od{color:#c0392b;font-weight:700}
  .main{flex:1;min-width:0;background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:14px;border-top:3px solid var(--light-blue)}
  .toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .navbtn{background:#fff;border:1px solid #e2ded2;color:var(--dark-brown);padding:5px 10px;font-size:14px;font-weight:700}
  .navbtn:disabled{opacity:.4;cursor:default}
  .navbtn.arrow{font-size:22px;padding:0 15px;line-height:1;display:inline-flex;align-items:center;justify-content:center;align-self:stretch}
  .ctxmenu{position:absolute;display:none;flex-direction:column;background:#fff;border:1px solid #e2ded2;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:100;overflow:hidden;min-width:120px}
  .ctxmenu.show{display:flex}
  .ctxmenu button{background:none;border:none;text-align:left;padding:8px 14px;font-size:13px;font-family:inherit;cursor:pointer;color:var(--dark-brown)}
  .ctxmenu button:hover{background:#f0efe7}
  #ctxDel:hover{background:#fdecea;color:#c0392b}
  .cpick{position:relative}
  .cpick-btn{width:100%;display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid #ddd;border-radius:7px;background:#fff;font-family:inherit;font-size:13px;cursor:pointer;text-align:left}
  .cpick-sw{width:14px;height:14px;border-radius:4px;flex:none}
  #mCalLbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cpick-caret{color:#8a8474;font-size:11px}
  .cpick-menu{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid #e2ded2;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.16);z-index:60;max-height:220px;overflow:auto;display:none}
  .cpick-menu.show{display:block}
  .cpick-opt{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;font-size:13px}
  .cpick-opt:hover{background:#eef6f5}
  .cpick-opt.sel{font-weight:700}
  .cpick-optsw{width:14px;height:14px;border-radius:4px;flex:none}
  .daypick{display:flex;gap:4px}
  .daychip{width:30px;height:30px;border-radius:6px;border:1px solid #ddd;background:#fff;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;color:#8a8474}
  .daychip.on{background:var(--dark-blue);color:#fff;border-color:var(--dark-blue)}
  .navbtn:hover{background:#f4f2ea}
  .today-btn{background:var(--light-brown);color:var(--dark-brown);border:none;padding:8px 22px;font-weight:700;font-size:15px;border-radius:8px}
  .navstack{display:flex;flex-direction:column;gap:6px}
  .navrow{display:flex;align-items:stretch;gap:8px}
  .gorow{display:flex;align-items:center;gap:6px}
  .period{font-size:18px;font-weight:700;margin:0 6px;min-width:180px}
  .viewtabs{display:inline-flex;gap:4px;margin-left:auto}
  .viewtabs button{background:#f0efe7;border:none;color:var(--dark-brown);padding:5px 12px;font-size:12px;font-weight:700}
  .viewtabs button.on{background:var(--dark-blue);color:#fff}
  .addev{background:var(--light-blue);color:var(--dark-brown);border:none;padding:6px 14px;font-weight:700;font-size:13px}

  /* MONTH */
  /* The weekday band is the calendar's header, so it wears the same rounded top as every
     other teal header in CraniaVerse (To-Do lists, IT Accounts categories, Projects columns):
     12 px on the top corners, square below. overflow:hidden clips the band to the curve. */
  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:auto repeat(6,1fr);height:68vh;border-left:1px solid #eee;border-radius:12px 12px 0 0;overflow:hidden}
  .dow{background:var(--dark-blue);font-size:11px;font-weight:700;color:#fff;text-align:center;padding:6px 0;border-right:1px solid rgba(255,255,255,.25);border-bottom:1px solid #eee;text-transform:uppercase;letter-spacing:.5px}
  .dow:last-of-type{border-right:none}
  .cell{min-height:0;border-right:1px solid #eee;border-bottom:1px solid #eee;padding:4px;position:relative;cursor:pointer;overflow:hidden}
  .cell.other{background:#fafaf7;color:#b8b2a2}
  .cell.today{background:#eefaff}
  .cell .dnum{font-size:12px;font-weight:700;margin-bottom:2px}
  .cell.today .dnum{background:var(--dark-blue);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center}
  .ev{font-size:11px;border-radius:4px;padding:1px 5px;margin-bottom:2px;color:#2e2516;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .ev .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}
  .more{font-size:10px;color:#8a8474;font-weight:600}
  .year-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;height:68vh;overflow:auto;align-content:start;padding-right:4px}
  .ym-title{font-weight:700;color:var(--dark-blue);margin-bottom:6px;font-size:14px}
  .ym-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .ym-dow{font-size:10px;color:#8a8474;text-align:center;font-weight:700;padding-bottom:2px}
  .ym-cell{font-size:11px;text-align:center;padding:3px 0;border-radius:5px;cursor:pointer;position:relative}
  .ym-cell.empty{cursor:default}
  .ym-cell:hover:not(.empty){background:#f0efe7}
  .ym-cell.today{background:var(--dark-blue);color:#fff;font-weight:700}
  .ym-cell.has::after{content:"";position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--light-brown)}

  /* TIME GRID (day/week) */
  .tg-wrap{display:flex;flex-direction:column;height:68vh;overflow:auto;border:1px solid #eee;border-radius:12px 12px 0 0}
  .tg-wrap.tg-full{max-height:none;overflow:visible}
  .tg-head{display:grid;position:sticky;top:0;background:var(--dark-blue);z-index:3;border-bottom:1px solid #eee}
  .tg-head .corner{border-right:1px solid rgba(255,255,255,.25)}
  .tg-hcol{text-align:center;padding:6px 2px;border-right:1px solid rgba(255,255,255,.25);font-size:11px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.5px}
  .tg-hcol .hd{font-weight:700}
  .tg-hcol.today{background:rgba(255,255,255,.18)}
  .tg-hcol.today .hd{color:#fff}
  .tg-allday{display:grid;border-bottom:1px solid #eee;min-height:22px}
  .tg-allday .corner{border-right:1px solid #eee;font-size:9px;color:#b8b2a2;display:flex;align-items:center;justify-content:center}
  .tg-adcell{border-right:1px solid #eee;padding:2px}
  .tg-body{display:grid;position:relative}
  .tg-times{border-right:1px solid #eee}
  .hourlabel{height:44px;font-size:10px;color:#b8b2a2;text-align:right;padding-right:4px;position:relative;top:-6px}
  .tg-col{border-right:1px solid #eee;position:relative}
  .hourline{height:44px;border-bottom:1px solid #f1f0ea}
  .tev{position:absolute;left:2px;right:2px;border-radius:5px;padding:2px 5px;font-size:11px;color:#2e2516;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .tev .tt{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .adchip{font-size:11px;border-radius:4px;padding:1px 5px;margin-bottom:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* AGENDA */
  .agenda{max-height:70vh;overflow:auto}
  .ag-day{margin-bottom:10px}
  .ag-date{font-size:11.5px;font-weight:700;color:var(--dark-blue);border-bottom:1px solid #eee;padding-bottom:3px;margin-bottom:4px}
  .ag-ev{display:flex;gap:6px;align-items:center;padding:2px 7px;border-radius:5px;cursor:pointer;font-size:11.5px}
  .ag-ev-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
  .ag-ev:hover{background:#f7f6f0}
  .ag-time{font-size:12px;color:#8a8474;width:120px;flex:none}
  .ag-dot{width:10px;height:10px;border-radius:50%;flex:none}
  .ag-empty{color:#b8b2a2;font-size:13px;padding:20px;text-align:center}

  /* MODAL */
  .overlay{position:fixed;inset:0;background:rgba(46,37,22,.4);display:none;align-items:center;justify-content:center;z-index:50}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:420px;box-shadow:0 12px 40px rgba(0,0,0,.3);max-height:92vh;overflow:auto}
  .modal::-webkit-scrollbar{width:10px}
  .modal::-webkit-scrollbar-thumb{background:#cfcabb;border-radius:8px;border:3px solid #fff}
  .modal::-webkit-scrollbar-thumb:hover{background:#b8b2a2}
  .modal::-webkit-scrollbar-track{background:transparent;margin:16px 0}
  #recurOpts{gap:8px;flex-wrap:wrap;align-items:flex-end}
  #recurOpts .fld{flex:1;min-width:130px}
  .modal h3{margin:0 0 16px;font-size:18px;color:var(--dark-brown)}
  .fld{margin-bottom:10px}
  .fld label{display:block;font-size:12.5px;font-weight:600;color:#6b6455;margin-bottom:5px}
  .fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid #d5d0c4;border-radius:8px;font-family:inherit;font-size:14px;color:var(--dark-brown)}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--dark-blue)}
  .fld textarea{resize:vertical;min-height:48px}
  .row2{display:flex;gap:8px}
  .row2 .fld{flex:1}
  .chkrow{display:flex;align-items:center;gap:6px;font-size:13px}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
  .btn-primary{background:var(--dark-blue);color:#fff;border:none;padding:8px 16px;font-weight:700}
  .btn-ghost{background:#eee;color:var(--dark-brown);border:none;padding:8px 16px;font-weight:600}
  .btn-del{background:#fff;color:#c0392b;border:1px solid #eecfca;padding:8px 12px;font-weight:600;margin-right:auto}
  .swatches{display:flex;gap:6px;flex-wrap:wrap}
  .sw{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px #d8d3c6}
  .sw.sel{box-shadow:0 0 0 2px var(--dark-brown)}
  .td-connect{margin-top:8px;background:var(--light-blue);color:var(--dark-brown);border:none;border-radius:8px;padding:6px 12px;font-weight:600;font-size:12.5px;cursor:pointer}
  footer{text-align:center;font-size:12px;color:#9a948a;padding:16px}
</style>
</head>

<div class="actionsrow">
  <button id="btnUndo" title="Undo (Ctrl+Z)" disabled>↶ Undo</button>
  <button id="btnRedo" title="Redo (Ctrl+Shift+Z)" disabled>↷</button>
  <button id="settingsBtn" title="Settings">⚙</button>
  <button id="btnYearImg" title="Save the whole year as a PNG image">🖼 Year Image</button>
  <button id="btnExport" title="Download all events as a CSV file">⤓ Export CSV</button>
</div>

<div class="calbar2"><div id="calList" class="calchips"></div><button class="toggleall" id="btnToggleAll">Hide/Show All</button><button class="addcal" id="btnAddCal">+ Add Calendar</button></div>

<div class="layout">
  <main class="main">
    <div class="toolbar">
      <div class="navstack">
        <div class="navrow">
          <button class="navbtn arrow" id="prev">&#8249;</button>
          <button class="today-btn" id="today">Today</button>
          <button class="navbtn arrow" id="next">&#8250;</button>
          <span class="period" id="period"></span>
        </div>
        <div class="gorow"><span class="golbl">Go To:</span><input type="date" id="goDate" class="godate" title="Go to date"></div>
      </div>
      <div class="viewtabs">
        <button data-view="day">Day</button>
        <button data-view="week">Week</button>
        <button data-view="month" class="on">Month</button>
        <button data-view="year">Year</button>
      </div>
      <button class="addev" id="btnAdd">+ New Event</button>
    </div>
    <div id="viewArea"></div>
  </main>
  <aside class="sidecol">
    <div class="sidebox box-up"><h3>Upcoming</h3><div id="agendaSide"></div></div>
    <div class="sidebox box-td"><h3>High-Priority To-Do's</h3><div id="todoSide"></div></div>
  </aside>
</div>
<footer>CraniaVerse · Calendar</footer>

<!-- Event modal -->
<div class="overlay" id="evOverlay">
  <div class="modal">
    <h3 id="evTitle">New Event</h3>
    <div class="fld"><label>Title</label><input id="mTitle" placeholder="Event title"></div>
    <div class="fld"><label>Calendar</label><div class="cpick" id="mCalPick"><button type="button" class="cpick-btn" id="mCalBtn"><span class="cpick-sw" id="mCalSw"></span><span id="mCalLbl">Calendar</span><span class="cpick-caret">▾</span></button><div class="cpick-menu" id="mCalMenu"></div></div></div>
    <div class="fld"><label>Date</label><input type="date" id="mDate"></div>
    <div class="chkrow" style="margin-bottom:10px"><input type="checkbox" id="mAllDay"><label for="mAllDay" style="margin:0;font-weight:600">All Day</label></div>
    <div class="row2" id="timeRow">
      <div class="fld"><label>Start</label><input type="time" id="mStart"></div>
      <div class="fld"><label>End</label><input type="time" id="mEnd"></div>
    </div>
    <div class="fld"><label>Notes</label><textarea id="mNotes" placeholder="Optional"></textarea></div>
    <div class="row2">
      <div class="fld" style="flex:1.3"><label>Repeat</label><select id="mRepeat"><option value="none">Does Not Repeat</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></div>
      <div class="fld" id="mIntWrap" style="flex:.6;display:none"><label>Every</label><input type="number" id="mInterval" min="1" value="1"></div>
      <div class="fld" id="mEndsWrap" style="flex:1;display:none"><label>Ends</label><select id="mRecEnd"><option value="never">Never</option><option value="on">On date</option><option value="after">After N times</option></select></div>
    </div>
    <div id="recurOpts" style="display:none">
      <div class="fld" id="mDaysWrap" style="display:none;flex:1.8"><label>On Days</label><div class="daypick" id="mDays"></div></div>
      <div class="fld" id="mUntilWrap" style="display:none"><label>End Date</label><input type="date" id="mUntil"></div>
      <div class="fld" id="mCountWrap" style="display:none"><label>Occurrences</label><input type="number" id="mCount" min="1" value="10"></div>
    </div>
    <div class="fld"><label>Event Colour</label><div class="swatches" id="mSwatches"></div></div>
    <div class="modal-actions">
      <button class="btn-del" id="mDelete" style="display:none">Delete</button>
      <button class="btn-ghost" id="mCancel">Cancel</button>
      <button class="btn-primary" id="mSave">Save</button>
    </div>
  </div>
</div>

<!-- Calendar modal -->
<div class="overlay" id="calOverlay">
  <div class="modal">
    <h3 id="calModalTitle">Add Calendar</h3>
    <div class="fld"><label>Name</label><input id="cName" placeholder="Name"></div>
    <div class="fld"><label>Colour</label><div class="swatches" id="cSwatches"></div></div>
    <div class="modal-actions">
      <button class="btn-del" id="cDelete" style="display:none">Delete</button>
      <button class="btn-ghost" id="cCancel">Cancel</button>
      <button class="btn-primary" id="cSave">Save</button>
    </div>
  </div>
</div>

<div class="overlay" id="tdOverlay">
  <div class="modal">
    <h3>Edit To-Do</h3>
    <div class="fld"><label>To-Do</label><input id="mTdText" placeholder="To-do text"></div>
    <div class="fld"><label>List</label><select id="mTdList"></select></div>
    <div class="row2">
      <div class="fld"><label>Priority</label><select id="mTdPri"><option value="high" style="background:#fadbd8;color:#922b21">High</option><option value="med" style="background:#E0DE85;color:#2E2516">Medium</option><option value="low" style="background:#A6E2F9;color:#2E2516">Low</option></select></div>
      <div class="fld"><label>Due Date</label><input type="date" id="mTdDue"></div>
    </div>
    <div class="fld"><label>Comments / Notes</label><textarea id="mTdNotes" placeholder="Optional"></textarea></div>
    <div class="modal-actions">

function isDarkColor(hex){ if(!hex) return false; hex=String(hex).replace("#",""); if(hex.length===3) hex=hex.split("").map(c=>c+c).join(""); if(hex.length<6) return false; const r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16); return (0.299*r+0.587*g+0.114*b) < 150; }

function dayNum(d){ return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000); }
function occursOn(ev,d){
  if(!ev.recur) return ev.date===iso(d);
  const start=parseISO(ev.date); const dn=dayNum(d), sn=dayNum(start);
  if(dn<sn) return false;
  if(ev.recur.until && dn>dayNum(parseISO(ev.recur.until))) return false;
  if((ev.exceptions||[]).includes(iso(d))) return false;
  const iv=Math.max(1,ev.recur.interval||1); const f=ev.recur.freq; let idx=-1;
  if(f==="daily"){ const diff=dn-sn; if(diff%iv) return false; idx=diff/iv; }
  else if(f==="weekly"){ const days=(ev.recur.days&&ev.recur.days.length)?ev.recur.days:[start.getDay()]; if(!days.includes(d.getDay())) return false; const sSun=sn-start.getDay(), dSun=dn-d.getDay(); const wdiff=Math.round((dSun-sSun)/7); if(wdiff<0||wdiff%iv) return false; if(ev.recur.count){ let cnt=0; for(let w=0; w<=wdiff; w+=iv){ const wk=sSun+w*7; for(const dd of days){ const onn=wk+dd; if(onn>=sn && onn<=dn) cnt++; } } if(cnt>ev.recur.count) return false; } return true; }
  else if(f==="monthly"){ if(d.getDate()!==Math.min(start.getDate(),daysInMonth(d.getFullYear(),d.getMonth()))) return false; const md=(d.getFullYear()-start.getFullYear())*12+(d.getMonth()-start.getMonth()); if(md%iv) return false; idx=md/iv; }
  else if(f==="yearly"){ if(d.getMonth()!==start.getMonth()) return false; if(d.getDate()!==Math.min(start.getDate(),daysInMonth(d.getFullYear(),d.getMonth()))) return false; const yd=d.getFullYear()-start.getFullYear(); if(yd%iv) return false; idx=yd/iv; }
  else return false;
  if(ev.recur.count && idx>=ev.recur.count) return false;
  return true;
}

function renderCalList(){
  const box=document.getElementById("calList"); box.innerHTML="";
  state.calendars.forEach(c=>{
    const chip=document.createElement("button"); chip.className="calchip"+(calVisible(c.id)?" on":"");
    chip.title="Click to show/hide · double-click to edit";
    chip.textContent=c.name; chip.draggable=true;
    if(calVisible(c.id)){ chip.style.background=c.color; chip.style.borderColor=c.color; chip.style.color=isDarkColor(c.color)?"#fff":"var(--dark-brown)"; }
    chip.title="Click to show/hide · double-click to edit · drag to reorder";
    chip.addEventListener("click",()=>{ if(calVisible(c.id)) state.hidden[c.id]=true; else delete state.hidden[c.id]; save(); renderCalList(); renderView(); });
    chip.addEventListener("dblclick",()=>openCalModal(c));
    chip.addEventListener("contextmenu",e=>{ e.preventDefault(); e.stopPropagation(); ctxCalId=c.id; const m=document.getElementById("calCtx"); m.style.left=e.pageX+"px"; m.style.top=e.pageY+"px"; m.classList.add("show"); });
    chip.addEventListener("dragstart",e=>{ dragCalId=c.id; e.dataTransfer.effectAllowed="move"; chip.classList.add("dragging"); });
    chip.addEventListener("dragend",()=>{ dragCalId=null; chip.classList.remove("dragging"); });
    chip.addEventListener("dragover",e=>{ e.preventDefault(); });
    chip.addEventListener("drop",e=>{ e.preventDefault(); if(!dragCalId||dragCalId===c.id) return; const rect=chip.getBoundingClientRect(); const after=e.clientX>rect.left+rect.width/2; const arr=state.calendars; const from=arr.findIndex(x=>x.id===dragCalId); const moved=arr.splice(from,1)[0]; let to=arr.findIndex(x=>x.id===c.id); if(after) to+=1; arr.splice(to,0,moved); save(); renderCalList(); renderView(); });
    box.appendChild(chip);
  });
  const ta=document.getElementById("btnToggleAll"); if(ta) ta.textContent="Hide/Show All";
}

function fmtDueShort(ds){ const d=parseISO(ds); return MONTHS[d.getMonth()].slice(0,3)+" "+d.getDate(); }
/* To-Do integration: reads/writes crania-todo.json via a file the user picks.
   Nothing is stored in the browser — re-pick the file each session if you want the panel. */
let todoHandle=null, todoData=null, todoLastText=null;
async function connectTodoFile(){
  if(!("showOpenFilePicker" in window)){ alert("This browser can't open the To-Do file. Please use Chrome or Edge."); return; }
  try{
    const [fh]=await window.showOpenFilePicker({types:[{description:"CraniaVerse To-Do data",accept:{"application/json":[".json"]}}]});
    const o={mode:"readwrite"};
    if(await fh.queryPermission(o)!=="granted" && await fh.requestPermission(o)!=="granted") return;
    const text=await (await fh.getFile()).text();
    let d=null; try{ d=JSON.parse(text); }catch(e){}
    if(!d||!Array.isArray(d.items)){ alert("That file doesn't look like crania-todo.json — pick the file from the To-Do app's folder."); return; }
    todoHandle=fh; todoData=d; todoLastText=text; renderTodoSide();
  }catch(e){ /* user cancelled */ }
}
async function readTodoFile(){
  if(!todoHandle) return;
  const ov=document.getElementById("tdOverlay"); if(ov && ov.classList.contains("show")) return;
  try{ const text=await (await todoHandle.getFile()).text();
    if(text && text!==todoLastText){ const d=JSON.parse(text); if(d&&Array.isArray(d.items)){ todoData=d; todoLastText=text; renderTodoSide(); } }
  }catch(e){}
}
async function writeTodoFile(){
  if(!todoHandle||!todoData) return;
  try{ const text=JSON.stringify(todoData,null,2); const w=await todoHandle.createWritable(); await w.write(text); await w.close(); todoLastText=text; }
  catch(e){}
}
function updateTodo(id, fn){ if(!todoData||!Array.isArray(todoData.items)) return; const it=todoData.items.find(i=>i.id===id); if(it){ fn(it); writeTodoFile(); } }
function renderTodoSide(){
  const box=document.getElementById("todoSide"); if(!box) return;
  const td=todoData;
  if(!td||!Array.isArray(td.items)){ box.innerHTML='<div class="ag-empty">Pick your <b>crania-todo.json</b> (in the To-Do app\'s folder) to see high-priority to-do\'s here.<br><button class="td-connect" id="btnTodoConnect">Choose To-Do File</button></div>'; const b=document.getElementById("btnTodoConnect"); if(b) b.addEventListener("click",connectTodoFile); return; }
  const today=new Date(); today.setHours(0,0,0,0);
  const hi=td.items.filter(i=>i.priority==="high" && !i.done).sort((a,b)=>{ const ea=a.due||"", eb=b.due||""; if(ea&&eb) return ea<eb?-1:(ea>eb?1:0); if(ea&&!eb) return -1; if(!ea&&eb) return 1; return 0; });
  if(!hi.length){ box.innerHTML='<div class="ag-empty">No high-priority to-dos.</div>'; return; }
  let html="";
  hi.slice(0,50).forEach(it=>{ const od = it.due && parseISO(it.due) < today; const due = it.due? (od?"Overdue · "+fmtDueShort(it.due):fmtDueShort(it.due)) : ""; html+=`<div class="td-row" data-id="${it.id}"><input type="checkbox" class="td-check" title="Mark done"><span class="td-text" title="Click to edit \u00b7 right-click for options">${esc(it.text)}</span>${due?`<span class="td-due${od?" od":""}">${due}</span>`:""}</div>`; });
  box.innerHTML=html;
  box.querySelectorAll(".td-check").forEach(cb=>{ cb.addEventListener("click",e=>e.stopPropagation()); cb.addEventListener("change",()=>{ const id=cb.closest(".td-row").dataset.id; updateTodo(id, it=>it.done=true); renderTodoSide(); }); });
  box.querySelectorAll(".td-text").forEach(el=>el.addEventListener("click",e=>{ e.stopPropagation(); openTodoEdit(el.closest(".td-row").dataset.id); }));
  box.querySelectorAll(".td-row").forEach(row=>row.addEventListener("dblclick",e=>{ if(e.target.closest("input,button")) return; openTodoEdit(row.dataset.id); }));
  box.querySelectorAll(".td-row").forEach(row=>row.addEventListener("contextmenu",e=>{ e.preventDefault(); e.stopPropagation(); ctxTodoId=row.dataset.id; const m=document.getElementById("todoCtx"); m.style.left=e.pageX+"px"; m.style.top=e.pageY+"px"; m.classList.add("show"); }));
}
function todoDup(id){ if(!todoData||!Array.isArray(todoData.items)) return; const idx=todoData.items.findIndex(i=>i.id===id); if(idx<0) return; const c=Object.assign({},todoData.items[idx],{id:uid(),done:false}); delete c.checklistId; delete c.entryId; todoData.items.splice(idx+1,0,c); writeTodoFile(); renderTodoSide(); }

/* A date heading reads better as "Today" when it is today — that is how someone scanning
   the sidebar actually thinks about it. Tomorrow gets the same treatment for the same reason. */
function dayHeading(d,longMonth){
  const t=new Date(); t.setHours(0,0,0,0);
  const dd=new Date(d); dd.setHours(0,0,0,0);
  const diff=Math.round((dd-t)/86400000);
  if(diff===0) return "Today";
  if(diff===1) return "Tomorrow";
  const m=longMonth?MONTHS[d.getMonth()]:MONTHS[d.getMonth()].slice(0,3);
  return DOW[d.getDay()]+", "+m+" "+d.getDate();
}

  area.querySelectorAll(".tg-col").forEach(col=>{ col.addEventListener("dragover",ev=>ev.preventDefault()); col.addEventListener("drop",ev=>{ ev.preventDefault(); if(dragEvId){ const r=col.getBoundingClientRect(); let mins=Math.round(((ev.clientY-r.top)/HOUR_H)*60/15)*15; mins=Math.max(0,Math.min(1425,mins)); moveEventToDateTime(dragEvId,col.dataset.date,mins); dragEvId=null; } }); });
  area.querySelectorAll(".tg-adcell").forEach(cell=>{ cell.addEventListener("dragover",ev=>ev.preventDefault()); cell.addEventListener("drop",ev=>{ ev.preventDefault(); if(dragEvId){ moveEventToDate(dragEvId,cell.dataset.date); dragEvId=null; } }); });

}
function toMin(t){ const[h,m]=t.split(":").map(Number); return h*60+(m||0); }
function fmtHM(m){ const h=Math.floor(m/60), mm=m%60; return String(h).padStart(2,"0")+":"+String(mm).padStart(2,"0"); }
function moveEventToDate(id,date){ const e=state.events.find(x=>x.id===id); if(!e||e.date===date) return; e.date=date; save(); renderView(); }
function moveEventToDateTime(id,date,mins){ const e=state.events.find(x=>x.id===id); if(!e) return; e.date=date; if(!e.allDay && e.start){ const oldS=toMin(e.start); const dur=e.end?Math.max(15,toMin(e.end)-oldS):60; e.start=fmtHM(mins); e.end=fmtHM(Math.min(1439,mins+dur)); } save(); renderView(); }
function packEvents(evs){
  const sorted=evs.slice().sort((a,b)=>toMin(a.start)-toMin(b.start));
  const result=[]; let cluster=[]; let clusterEnd=-1;
  function flush(){ const n=cluster.length; const colEnd=[]; cluster.forEach(e=>{ const s=toMin(e.start), en=e.end?toMin(e.end):s+60; let placed=-1; for(let i=0;i<colEnd.length;i++){ if(colEnd[i]<=s){ placed=i; break; } } if(placed<0){ placed=colEnd.length; colEnd.push(0); } colEnd[placed]=en; e._col=placed; }); const cols=colEnd.length; cluster.forEach(e=>result.push({ev:e,col:e._col,cols:cols})); cluster=[]; clusterEnd=-1; }
  sorted.forEach(e=>{ const s=toMin(e.start), en=e.end?toMin(e.end):s+60; if(cluster.length&&s>=clusterEnd){ flush(); } cluster.push(e); clusterEnd=Math.max(clusterEnd,en); });
  if(cluster.length) flush();
  return result;
}

function openEvModal(id, date, time, allDay, occDate){

  if(id){
    const e=state.events.find(x=>x.id===id); if(!e) return;
    document.getElementById("evTitle").textContent="Edit Event";
    document.getElementById("mTitle").value=e.title;

    document.getElementById("mEnd").value=e.end||"";
    document.getElementById("mNotes").value=e.notes||""; pickedEvColor=e.color||""; renderEvSwatches();

    document.getElementById("mDelete").style.display="";
  }else{
    document.getElementById("evTitle").textContent="New Event";
    document.getElementById("mTitle").value="";
    setCalPick(state.calendars[0].id);

function addHour(t){ let[h,m]=t.split(":").map(Number); h=(h+1)%24; return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0"); }
function toggleTimeRow(){ document.getElementById("timeRow").style.display = document.getElementById("mAllDay").checked?"none":"flex"; }
function closeEvModal(){ document.getElementById("evOverlay").classList.remove("show"); }
function renderDayPick(){ const box=document.getElementById("mDays"); if(!box) return; box.innerHTML=""; const names=["S","M","T","W","T","F","S"]; const order=[1,2,3,4,5,6,0]; order.forEach(i=>{ const b=document.createElement("button"); b.type="button"; b.className="daychip"+(pickedDays.includes(i)?" on":""); b.textContent=names[i]; b.addEventListener("click",()=>{ if(pickedDays.includes(i)) pickedDays=pickedDays.filter(x=>x!==i); else pickedDays.push(i); renderDayPick(); }); box.appendChild(b); }); }
function gatherRecur(){ const f=document.getElementById("mRepeat").value; if(f==="none") return null; const iv=Math.max(1,Number(document.getElementById("mInterval").value)||1); const end=document.getElementById("mRecEnd").value; const r={freq:f,interval:iv,until:"",count:0}; if(end==="on") r.until=document.getElementById("mUntil").value||""; else if(end==="after") r.count=Math.max(1,Number(document.getElementById("mCount").value)||1); if(f==="weekly") r.days=pickedDays.slice().sort((a,b)=>a-b); return r; }
function toggleRecurUI(){
  const f=document.getElementById("mRepeat").value, on=f!=="none";
  document.getElementById("mIntWrap").style.display=on?"":"none";
  document.getElementById("mEndsWrap").style.display=on?"":"none";
  const end=document.getElementById("mRecEnd").value;
  const showDays=(f==="weekly"), showUntil=(on&&end==="on"), showCount=(on&&end==="after");
  document.getElementById("mDaysWrap").style.display=showDays?"":"none";
  document.getElementById("mUntilWrap").style.display=showUntil?"":"none";
  document.getElementById("mCountWrap").style.display=showCount?"":"none";
  document.getElementById("recurOpts").style.display=(showDays||showUntil||showCount)?"flex":"none";
}
function openScope(mode){ scopeMode=mode; document.getElementById("scopeTitle").textContent=mode==="delete"?"Delete Recurring Event":"Edit Recurring Event"; document.getElementById("scopeOverlay").classList.add("show"); }
function closeScope(){ document.getElementById("scopeOverlay").classList.remove("show"); }
function applyScope(scope){
  const master=state.events.find(x=>x.id===editEvId); if(!master){ closeScope(); return; }
  const occ = editOcc || master.date;
  if(scopeMode==="delete"){
    if(scope==="this"){ master.exceptions=master.exceptions||[]; if(!master.exceptions.includes(occ)) master.exceptions.push(occ); }
    else if(scope==="following"){ master.recur=Object.assign({},master.recur,{until:iso(addDays(parseISO(occ),-1)),count:0}); if(dayNum(parseISO(occ))<=dayNum(parseISO(master.date))) state.events=state.events.filter(e=>e.id!==master.id); }
    else { state.events=state.events.filter(e=>e.id!==master.id); }
    save(); closeScope(); closeEvModal(); renderView(); return;
  }
  const data=pendingSave.data, recur=pendingSave.recur;
  if(scope==="this"){
    master.exceptions=master.exceptions||[]; if(!master.exceptions.includes(occ)) master.exceptions.push(occ);
    state.events.push(Object.assign({id:uid()},data,{recur:null}));
  } else if(scope==="following"){
    master.recur=Object.assign({},master.recur,{until:iso(addDays(parseISO(occ),-1)),count:0});
    state.events.push(Object.assign({id:uid(),exceptions:[]},data,{recur:recur?Object.assign({},recur):null}));
    if(dayNum(parseISO(occ))<=dayNum(parseISO(master.date))) state.events=state.events.filter(e=>e.id!==master.id);
  } else {
    const delta=dayNum(parseISO(data.date))-dayNum(parseISO(occ));
    const newDate = delta? iso(addDays(parseISO(master.date),delta)) : master.date;
    Object.assign(master,data,{date:newDate,recur:recur?Object.assign({},recur):null});
    if(!master.exceptions) master.exceptions=[];
  }
  save(); closeScope(); closeEvModal(); renderView();
}

function populateCalPick(){ const menu=document.getElementById("mCalMenu"); if(!menu) return; menu.innerHTML=""; state.calendars.forEach(c=>{ const o=document.createElement("div"); o.className="cpick-opt"+(c.id===pickedCalId?" sel":""); o.innerHTML=`<span class="cpick-optsw" style="background:${c.color}"></span><span>${esc(c.name)}</span>`; o.addEventListener("click",()=>{ setCalPick(c.id); menu.classList.remove("show"); }); menu.appendChild(o); }); }

function saveEvent(){
  const title=document.getElementById("mTitle").value.trim();
  if(!title){ document.getElementById("mTitle").focus(); return; }
  const allDay=document.getElementById("mAllDay").checked;
  const data={ calId:pickedCalId, title, date:document.getElementById("mDate").value,
    allDay, start:allDay?"":document.getElementById("mStart").value, end:allDay?"":document.getElementById("mEnd").value,
    notes:document.getElementById("mNotes").value.trim(), color:pickedEvColor };

  if(!editEvId){ state.events.push(Object.assign({id:uid(),exceptions:[]},data,{recur})); save(); closeEvModal(); renderView(); return; }
  const master=state.events.find(x=>x.id===editEvId);
  if(master && master.recur){ pendingSave={data:data,recur:recur}; openScope("save"); return; }
  Object.assign(master,data,{recur}); if(recur&&!master.exceptions) master.exceptions=[]; save(); closeEvModal(); renderView();
}
function duplicateEvent(){ if(!editEvId) return; const e=state.events.find(x=>x.id===editEvId); if(!e) return; const copy=Object.assign({},e,{id:uid()}); if(copy.exceptions) copy.exceptions=copy.exceptions.slice(); state.events.push(copy); save(); openEvModal(copy.id); }

function csvCell(v){ v = String(v==null?"":v); return '"'+v.replace(/"/g,'""')+'"'; }
function csvDownload(name, rows){

function recurLabel(rc){
  if(!rc) return "";
  const iv = Math.max(1, rc.interval||1);
  let s = (iv>1 ? "Every "+iv+" " : "") + rc.freq;
  if(rc.freq==="weekly" && rc.days && rc.days.length) s += " ("+rc.days.map(d=>DOW[d]).join(", ")+")";
  if(rc.until) s += " until "+rc.until;
  if(rc.count) s += " ×"+rc.count;
  return s;
}
function csvText(){
  const rows=[["Calendar","Title","Date","All Day","Start","End","Repeats","Notes"]];
  state.events.slice().sort((a,b)=> (a.date||"").localeCompare(b.date||"") || (a.start||"").localeCompare(b.start||"")).forEach(e=>{
    const cal = state.calendars.find(c=>c.id===e.calId);
    rows.push([cal?cal.name:"", e.title||"", e.date||"", e.allDay?"Yes":"No", e.start||"", e.end||"", recurLabel(e.recur), e.notes||""]);
  });
  return rows;
}
/* ---------- year image ----------
   Twelve month blocks in a 4x3 grid, each day tinted with the colour of the calendar it has
   an event on, plus a legend naming every calendar. Drawn to a canvas and written out as a
   PNG so it can be printed or sent on. Every calendar is included, whether or not it is
   currently ticked on screen — the picture is the year, not the current view. */
const YR = { pad:40, titleH:104, cols:4, mw:300, mh:250, gapX:24, gapY:22, legendH:0 };

function yearImageModel(year, calIds){
  const byDay={};
  const evs=(state.events||[]).filter(e=>calIds.includes(e.calId));
  for(let m=0;m<12;m++){
    const dim=new Date(year,m+1,0).getDate();
    for(let d=1;d<=dim;d++){
      const date=new Date(year,m,d);
      const hits=[];
      evs.forEach(e=>{ if(occursOn(e,date)){ const c=e.calId; if(!hits.includes(c)) hits.push(c); } });
      if(hits.length) byDay[m+"-"+d]=hits;
    }
  }
  return byDay;
}

function drawYear(year, calIds){
  const cals=(state.calendars||[]).filter(c=>calIds.includes(c.id));
  const rows=Math.ceil(12/YR.cols);
  const W = YR.pad*2 + YR.cols*YR.mw + (YR.cols-1)*YR.gapX;
  const legendRows=Math.ceil(cals.length/3);
  const legendH = 30 + legendRows*24;
  const H = YR.pad + YR.titleH + rows*YR.mh + (rows-1)*YR.gapY + legendH + YR.pad;

  const c=document.createElement("canvas");
  const S=2; c.width=W*S; c.height=H*S;
  const g=c.getContext("2d"); g.scale(S,S);
  const F=(w,s)=>w+" "+s+"px 'Segoe UI', system-ui, Arial, sans-serif";
  const rr=(x0,y0,w,h,r)=>{ g.beginPath(); g.moveTo(x0+r,y0); g.arcTo(x0+w,y0,x0+w,y0+h,r); g.arcTo(x0+w,y0+h,x0,y0+h,r); g.arcTo(x0,y0+h,x0,y0,r); g.arcTo(x0,y0,x0+w,y0,r); g.closePath(); };

  g.fillStyle="#FFFFFF"; g.fillRect(0,0,W,H);
  g.fillStyle="#2E2516"; g.fillRect(0,0,W,YR.titleH-22);
  g.textBaseline="middle";
  g.fillStyle="#FFFFFF"; g.font=F("700",28);
  g.fillText("Crania Schools — "+year+" Calendar", YR.pad, (YR.titleH-22)/2-9);
  g.fillStyle="#C9D6D5"; g.font=F("400",14);
  g.fillText(cals.length+" calendar"+(cals.length===1?"":"s")+" · generated "+iso(new Date()), YR.pad, (YR.titleH-22)/2+17);

  const byDay=yearImageModel(year, calIds);
  const MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DW=["M","T","W","T","F","S","S"];

  for(let m=0;m<12;m++){
    const cx = YR.pad + (m%YR.cols)*(YR.mw+YR.gapX);
    const cy = YR.titleH + Math.floor(m/YR.cols)*(YR.mh+YR.gapY);
    g.fillStyle="#5FA09E"; rr(cx,cy,YR.mw,26,6); g.fill();
    g.fillStyle="#FFFFFF"; g.font=F("700",13); g.textAlign="center";
    g.fillText(MON[m].toUpperCase(), cx+YR.mw/2, cy+13);

    const cw=YR.mw/7, top=cy+34;
    g.font=F("700",10); g.fillStyle="#8A8474";
    DW.forEach((d,i)=>g.fillText(d, cx+cw*i+cw/2, top+7));

    const first=new Date(year,m,1);
    const lead=(first.getDay()+6)%7;                 // weeks start Monday
    const dim=new Date(year,m+1,0).getDate();
    for(let d=1;d<=dim;d++){
      const idx=lead+d-1, col=idx%7, row=Math.floor(idx/7);
      const x0=cx+col*cw, y0=top+18+row*26;
      const hits=byDay[m+"-"+d];
      if(hits && hits.length){
        const col1=(state.calendars.find(c=>c.id===hits[0])||{}).color||"#A6E2F9";
        g.fillStyle=col1; rr(x0+2,y0,cw-4,22,5); g.fill();
        if(hits.length>1){                            // a second calendar shows as a corner wedge
          const col2=(state.calendars.find(c=>c.id===hits[1])||{}).color||"#E0DE85";
          g.fillStyle=col2; g.beginPath();
          g.moveTo(x0+cw-4,y0); g.lineTo(x0+cw-4,y0+10); g.lineTo(x0+cw-14,y0); g.closePath(); g.fill();
        }
        g.fillStyle=isDarkColor(col1)?"#FFFFFF":"#2E2516";
      } else g.fillStyle="#6B6455";
      g.font=F("400",11);
      g.fillText(String(d), x0+cw/2, y0+11);
    }
  }

  // legend
  let ly = YR.titleH + rows*YR.mh + (rows-1)*YR.gapY + 14;
  g.textAlign="left"; g.fillStyle="#2E2516"; g.font=F("700",13);
  g.fillText("Calendars", YR.pad, ly);
  ly += 22;
  cals.forEach((cl,i)=>{
    const cxx = YR.pad + (i%3)*((W-YR.pad*2)/3);
    const cyy = ly + Math.floor(i/3)*24;
    g.fillStyle=cl.color||"#A6E2F9"; rr(cxx,cyy-8,16,16,4); g.fill();
    g.fillStyle="#2E2516"; g.font=F("400",12);
    g.fillText(cl.name||"Untitled", cxx+24, cyy);
  });

  g.fillStyle="#9A948A"; g.font=F("400",11);
  g.fillText("CraniaVerse · Calendar", YR.pad, H-YR.pad/2);
  return c;
}

/* ============ Crania JSON-file-only storage (File System Access API) ============ */
/* Saves app data to a real .json file in a folder you pick. NOTHING is stored in the
   browser: no localStorage, no IndexedDB, no remembered permissions. You re-pick the
   folder once each time you open the app. Live multi-user sync (re-reads the file
   every 3s) and a dated daily backup file are kept — the daily marker is the backup
   file itself in your folder, not anything in the browser. */
const CraniaStore = (function(){
  let cfg=null, fileHandle=null, dirHandle=null, connected=false;
  let lastFileText=null, pendingSave=false, saveTimer=null;
  let lastBackupAt=null;
  const supportsDir = ("showDirectoryPicker" in window);
  async function verify(h){ const o={mode:"readwrite"}; if(await h.queryPermission(o)==="granted") return true; if(await h.requestPermission(o)==="granted") return true; return false; }
  function isoToday(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function setConnected(v){ connected=v; if(cfg&&cfg.onStatus) cfg.onStatus(v, supportsDir); }
  async function connect(){
    if(!supportsDir){ alert("This browser can't save to a folder. Please use Chrome or Edge."); return; }
    try{
      const dir=await window.showDirectoryPicker({mode:"readwrite"});
      if(!(await verify(dir))) return;
      const fh=await dir.getFileHandle(cfg.fileName,{create:true});
      const text=await (await fh.getFile()).text();
      if(text.trim()){
        let data=null; try{ data=JSON.parse(text); }catch(e){}
        if(!data || !cfg.validate(data)){ alert("A file named "+cfg.fileName+" is already in that folder but isn't valid data for this app, so I didn't connect (to avoid overwriting it). Pick a different folder, or check that file."); return; }
        fileHandle=fh; dirHandle=dir;
        cfg.applyState(data); lastFileText=text;
      }else{
        fileHandle=fh; dirHandle=dir;
        await writeNow();  // brand-new file: seed it from whatever is on screen right now
      }
      setConnected(true); maybeBackup();
    }catch(e){ /* user cancelled the picker */ }
  }
  async function writeNow(){
    if(!fileHandle){ pendingSave=false; return; }
    const text=JSON.stringify(cfg.getState(),null,2);
    try{ const w=await fileHandle.createWritable(); await w.write(text); await w.close(); lastFileText=text; }
    catch(e){ setConnected(false); }
    pendingSave=false;
  }
  function write(){
    if(!cfg||!fileHandle) return;
    pendingSave=true; clearTimeout(saveTimer); saveTimer=setTimeout(writeNow,400);
  }
  async function poll(){
    if(!fileHandle||pendingSave) return;
    if(cfg.busy && cfg.busy()) return;     // don't yank data out from under an open editor
    try{ const text=await (await fileHandle.getFile()).text();
      if(text && text.trim() && text!==lastFileText){ const d=JSON.parse(text); if(d && cfg.validate(d)){ cfg.applyState(d); lastFileText=text; } }
    }catch(e){}
  }
  function backupName(){ return cfg.fileName.replace(/\.json$/,"")+"-backup-"+isoToday()+".json"; }
  async function backupExistsToday(){
    if(!dirHandle) return false;
    try{ await dirHandle.getFileHandle(backupName()); return true; }catch(e){ return false; }
  }
  async function writeBackup(){
    if(!dirHandle) return false;
    try{ if(await dirHandle.queryPermission({mode:"readwrite"})!=="granted") return false;
      const bh=await dirHandle.getFileHandle(backupName(),{create:true});
      const w=await bh.createWritable(); await w.write(JSON.stringify(cfg.getState(),null,2)); await w.close();
      lastBackupAt=new Date();
      prune(); return true;
    }catch(e){ return false; }
  }
  async function maybeBackup(){ if(!dirHandle) return; if(await backupExistsToday()) return; await writeBackup(); }
  async function prune(){
    if(!dirHandle) return;
    try{ const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-14);
      const base=cfg.fileName.replace(/\.json$/,"").replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
      const re=new RegExp("^"+base+"-backup-(\\d{4}-\\d{2}-\\d{2})\\.json$");
      for await (const [name] of dirHandle.entries()){ const m=re.exec(name); if(m){ const d=new Date(m[1]+"T00:00:00"); if(d<cutoff){ try{ await dirHandle.removeEntry(name); }catch(e){} } } }
    }catch(e){}
  }
  async function boot(c){
    cfg=c;
    setConnected(false);           // never connected on open: nothing is remembered
    if(!supportsDir) return;
    setInterval(poll,3000);
    function armMidnightBackup(){
      const now=new Date(); const next=new Date(now); next.setHours(24,0,0,0);
      setTimeout(async ()=>{ await maybeBackup(); armMidnightBackup(); }, (next-now)+2000);
    }
    armMidnightBackup();
  }
  async function writeBlobInFolder(name, blob, unique){
    if(!dirHandle) return false;
    try{
      if(await dirHandle.queryPermission({mode:"readwrite"})!=="granted") return false;
      let final=name;
      if(unique){
        const m=name.match(/^(.*)(\.[^.]+)$/); const base=m?m[1]:name, ext=m?m[2]:"";
        for(let i=2;i<100;i++){
          let exists=true;
          try{ await dirHandle.getFileHandle(final,{create:false}); }catch(e){ exists=false; }
          if(!exists) break;
          final=base+" ("+i+")"+ext;
        }
      }
      const h=await dirHandle.getFileHandle(final,{create:true});
      const w=await h.createWritable(); await w.write(blob); await w.close();
      return true;
    }catch(e){ return false; }
  }
  async function writeFileInFolder(name, text, unique){
    if(!dirHandle) return false;
    try{
      if(await dirHandle.queryPermission({mode:"readwrite"})!=="granted") return false;
      let final=name;
      if(unique){
        const m=name.match(/^(.*)(\.[^.]+)$/); const base=m?m[1]:name, ext=m?m[2]:"";
        let i=2;
        for(;;){
          try{ await dirHandle.getFileHandle(final); }catch(e){ break; }  // free name found
          final=base+" ("+(i++)+")"+ext;
          if(i>500) break;
        }
      }
      const fh=await dirHandle.getFileHandle(final,{create:true});
      const w=await fh.createWritable(); await w.write(text); await w.close();
      return true;
    }catch(e){ return false; }
  }
  async function lastBackup(){
    if(lastBackupAt) return { d:lastBackupAt, exact:true };
    if(!dirHandle) return null;
    try{
      const base=cfg.fileName.replace(/\.json$/,"").replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
      const re=new RegExp("^"+base+"-backup-(\\d{4}-\\d{2}-\\d{2})\\.json$");
      let best=null;
      for await (const [name] of dirHandle.entries()){ const m=re.exec(name); if(m && (!best || m[1]>best)) best=m[1]; }
      return best ? { d:new Date(best+"T00:00:00"), exact:false } : null;
    }catch(e){ return null; }
  }
  return { boot, connect, write, writeFileInFolder, writeBlobInFolder, backupNow:writeBackup, lastBackup,
    validateData:(d)=>cfg?cfg.validate(d):false,
    applyData:(d)=>{ if(cfg){ cfg.applyState(d); write(); } },
    isConnected:()=>connected, hasUnsaved:()=>pendingSave, supportsDir };
})();
